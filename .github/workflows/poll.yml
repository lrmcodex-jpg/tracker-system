name: Poll Find My

# WHY THIS IS SHAPED LIKE THIS
#
# GitHub's "*/5" cron never fired once for this repo: in the first ~2 hours the
# only runs were manual. Short-interval schedules are best-effort and are the
# first thing GitHub drops under load, so one poll per cron tick means relying on
# the least reliable part of the system.
#
# Instead each run POLLS IN A LOOP for ~55 minutes and then exits, so the cron
# only has to fire roughly once an hour to keep coverage continuous. A skipped
# tick self-heals on the next one. The repo is public, so Actions minutes are
# unlimited and the long-running job costs nothing.

on:
  schedule:
    # Hourly, plus a half-past tick so a missed hour recovers within 30 minutes.
    - cron: "3 * * * *"
    - cron: "33 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run should keep polling, in minutes"
        required: false
        default: "55"

# One poller at a time. A newer queued run replaces an older queued one, so the
# queue can never grow, but a run already in flight is left alone.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache anisette libs
        uses: actions/cache@v4
        with:
          path: /tmp/ani_libs.bin
          key: ani-libs-v1

      - name: Install dependencies
        run: pip install -r requirements-poller.txt

      - name: Poll in a loop
        env:
          DB_URL: ${{ secrets.DB_URL }}
          KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Never interpolated into the script directly; read as an env var and
          # stripped to digits below, so a crafted input cannot inject shell.
          RUN_MINUTES_RAW: ${{ github.event.inputs.minutes }}
        run: |
          set -u
          MINUTES=$(printf '%s' "${RUN_MINUTES_RAW:-}" | tr -cd '0-9')
          [ -z "$MINUTES" ] && MINUTES=55
          [ "$MINUTES" -gt 60 ] && MINUTES=60
          [ "$MINUTES" -lt 1 ] && MINUTES=1

          INTERVAL=300                       # 5 minutes between polls
          DEADLINE=$(( $(date +%s) + MINUTES * 60 ))
          N=0
          FAILS=0
          echo "Polling every ${INTERVAL}s for ${MINUTES} minute(s)."

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            N=$((N + 1))
            echo "::group::poll #$N at $(date -u '+%H:%M:%S') UTC"
            if python -m app.fetcher; then
              FAILS=0
            else
              FAILS=$((FAILS + 1))
              echo "poll #$N failed (consecutive failures: $FAILS)"
              # Three in a row means something real is wrong: an expired Apple
              # session, or the database unreachable. Fail the run so it shows up
              # red instead of quietly looping on a broken state.
              if [ "$FAILS" -ge 3 ]; then
                echo "::error::Three consecutive poll failures, stopping."
                exit 1
              fi
            fi
            echo "::endgroup::"
            REMAIN=$(( DEADLINE - $(date +%s) ))
            [ "$REMAIN" -lt "$INTERVAL" ] && break
            sleep "$INTERVAL"
          done
          echo "Completed $N poll(s) in this run."
