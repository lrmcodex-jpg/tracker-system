name: Poll Find My

# Runs the fetcher on a schedule. GitHub Actions cron minimum is 5 minutes and
# is best-effort (can drift under load). Find My data is delayed anyway, so this
# is fine. You can also trigger it manually from the Actions tab.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Avoid overlapping runs if one takes a while.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache anisette libs
        uses: actions/cache@v4
        with:
          path: /tmp/ani_libs.bin
          key: ani-libs-v1

      - name: Install dependencies
        run: pip install -r requirements-poller.txt

      - name: Run poller
        env:
          DB_URL: ${{ secrets.DB_URL }}
          KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python -m app.fetcher
