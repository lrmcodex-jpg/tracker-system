name: Poll Find My

# Runs the fetcher on a schedule. GitHub Actions cron minimum is 5 minutes and
# is best-effort (can drift under load). Find My data is delayed anyway, so this
# is fine. You can also trigger it manually from the Actions tab.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # lets the failure step open an alert issue

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache anisette libs
        uses: actions/cache@v4
        with:
          path: /tmp/ani_libs.bin
          key: ani-libs-v1

      - name: Install dependencies
        run: pip install -r requirements-poller.txt

      - name: Run poller
        env:
          DB_URL: ${{ secrets.DB_URL }}
          KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: python -m app.fetcher

      # If the poller failed, open (or update) a GitHub issue so the team is
      # notified by GitHub's normal email/notification system. Most commonly a
      # failure means the Apple session expired and needs a re-login:
      #   python -m app.setup_apple_login
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ Find My poller failed — action needed";
            const body = [
              "The scheduled Find My poll failed. The map will go stale until this is fixed.",
              "",
              "**Most likely cause:** the Apple fetching session expired. Re-login on a machine with the repo:",
              "```",
              "python -m app.setup_apple_login",
              "```",
              "",
              `Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            // Reuse an existing open alert issue if there is one, else create it.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "poller-alert",
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["poller-alert"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: "Poller failed again.\n\n" + body,
              });
            }
