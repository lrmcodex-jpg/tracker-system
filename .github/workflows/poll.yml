name: Poll Find My

# WHY THIS DOES NOT USE A SCHEDULE
#
# GitHub's scheduler never fired for this repository. Over five hours it was
# tried at "*/5 * * * *", then hourly at ":03" and ":33", on a public repo with
# unlimited Actions minutes, with the workflow active and Actions enabled. Zero
# scheduled runs. Meanwhile every workflow_dispatch ran perfectly.
#
# So the schedule is kept only as a free backup in case GitHub ever starts
# honouring it, and the real mechanism is a chain: each run polls for ~5.5 hours
# and then starts its successor with an explicit dispatch. GitHub's built-in
# GITHUB_TOKEN deliberately cannot trigger another workflow (loop protection),
# so the chain step uses DISPATCH_PAT.

on:
  schedule:
    - cron: "7 */4 * * *"   # backup only; has never actually fired
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run should keep polling, in minutes"
        required: false
        default: "330"
      chain:
        description: "Start a successor run when this one ends (true/false)"
        required: false
        default: "true"

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # GitHub hard-caps a job at 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache anisette libs
        uses: actions/cache@v4
        with:
          path: /tmp/ani_libs.bin
          key: ani-libs-v1

      - name: Install dependencies
        run: pip install -r requirements-poller.txt

      - name: Poll in a loop
        id: poll
        env:
          DB_URL: ${{ secrets.DB_URL }}
          KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Read via env and sanitised below; never interpolated into the shell.
          RUN_MINUTES_RAW: ${{ github.event.inputs.minutes }}
        run: |
          set -u
          MINUTES=$(printf '%s' "${RUN_MINUTES_RAW:-}" | tr -cd '0-9')
          [ -z "$MINUTES" ] && MINUTES=330
          [ "$MINUTES" -gt 330 ] && MINUTES=330
          [ "$MINUTES" -lt 1 ] && MINUTES=1

          INTERVAL=300
          STARTED=$(date +%s)
          DEADLINE=$(( STARTED + MINUTES * 60 ))
          N=0; FAILS=0
          echo "Polling every ${INTERVAL}s for ${MINUTES} minute(s)."

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            N=$((N + 1))
            echo "::group::poll #$N at $(date -u '+%H:%M:%S') UTC"
            if python -m app.fetcher; then
              FAILS=0
            else
              FAILS=$((FAILS + 1))
              echo "poll #$N failed (consecutive: $FAILS)"
              if [ "$FAILS" -ge 3 ]; then
                echo "::error::Three consecutive poll failures, stopping."
                echo "ran_seconds=$(( $(date +%s) - STARTED ))" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
            echo "::endgroup::"
            REMAIN=$(( DEADLINE - $(date +%s) ))
            [ "$REMAIN" -lt "$INTERVAL" ] && break
            sleep "$INTERVAL"
          done
          echo "ran_seconds=$(( $(date +%s) - STARTED ))" >> "$GITHUB_OUTPUT"
          echo "Completed $N poll(s)."

      - name: Start the successor run
        # Always chain, including after a failure, so one bad Apple response
        # cannot end the collector permanently. The guard below stops a crash
        # loop: a run that died in under two minutes does not get a successor.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          RAN_SECONDS: ${{ steps.poll.outputs.ran_seconds }}
          CHAIN_RAW: ${{ github.event.inputs.chain }}
        run: |
          set -u
          CHAIN=$(printf '%s' "${CHAIN_RAW:-true}" | tr -cd 'a-z')
          [ "$CHAIN" = "false" ] && { echo "Chaining disabled for this run."; exit 0; }
          RAN=$(printf '%s' "${RAN_SECONDS:-0}" | tr -cd '0-9')
          [ -z "$RAN" ] && RAN=0
          if [ "$RAN" -lt 120 ]; then
            echo "::warning::Run lasted ${RAN}s (<120s). Not chaining, to avoid a crash loop."
            exit 0
          fi
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::DISPATCH_PAT is not set, so no successor was started."
            exit 0
          fi
          echo "Starting the successor run."
          gh workflow run poll.yml --repo "$GITHUB_REPOSITORY" -f minutes=330 -f chain=true
